<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Web Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      text-align: center;
    }

    .hero {
      background: #000;
      color: white;
      padding: 80px 20px;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 40px 20px;
      flex-wrap: wrap;
    }

    .feature-btn {
      background: white;
      padding: 15px 25px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .cta-btn {
      margin-top: 30px;
      background: #1e73ff;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 400px;
      width: 90%;
    }
  </style>
</head>

<body>

  <section class="hero">
    <h1>My Web Portfolio</h1>
    <p>Clean, responsive, and modular web design</p>
  </section>

  <section class="features">
    <button class="feature-btn" onclick="showInfo('Responsive Design adapts to all screen sizes.')">
      Responsive Design
    </button>

    <button class="feature-btn" onclick="showInfo('Modern UI with clean layout.')">
      Modern UI
    </button>

    <button class="feature-btn" onclick="showInfo('Optimized Performance ensures fast loading.')">
      Optimized Performance
    </button>
  </section>

  <button class="cta-btn" onclick="openModal()">Click Me</button>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2>It works! 🎉</h2>
      <p>Your portfolio is interactive now.</p>
      <button onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    function showInfo(message) {
      alert(message);
    }

    function openModal() {
      document.getElementById("modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }
  </script>

</body>
</html>
