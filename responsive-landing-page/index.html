<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarushi Mahesh | Frontend Developer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #222;
    }

    /* HERO SECTION */
    .hero {
      background: #000;
      color: white;
      padding: 140px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 52px;
      margin-bottom: 10px;
    }

    .hero h2 {
      font-size: 26px;
      font-weight: normal;
      color: #4da3ff;
      margin-bottom: 18px;
    }

    .hero p {
      font-size: 17px;
      opacity: 0.9;
      margin-bottom: 28px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .cta-btn {
      display: inline-block;
      background: #1e73ff;
      color: white;
      padding: 14px 30px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 16px;
      transition: 0.3s ease;
    }

    .cta-btn:hover {
      background: #0f5be0;
      transform: translateY(-2px);
    }

    /* PROJECTS PLACEHOLDER */
    #projects {
      padding: 80px 20px;
      text-align: center;
      background: #ffffff;
    }

    #projects h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    #projects p {
      color: #555;
    }

    /* FOOTER */
    footer {
      background: #000;
      color: #aaa;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .hero h1 {
        font-size: 36px;
      }

      .hero h2 {
        font-size: 20px;
      }

      .hero p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <section class="hero">
    <h1>Tarushi Mahesh</h1>
    <h2>Frontend Developer</h2>
    <p>
      I create responsive, user-friendly web interfaces with modern design and clean code.
    </p>

    <a href="#projects" class="cta-btn">View My Projects</a>
  </section>

  <!-- PROJECTS SECTION (next step will design this) -->
  <section id="projects">
    <h2>Projects Coming Soon</h2>
    <p>This section will showcase my real development work.</p>
  </section>

  <!-- FOOTER -->
  <footer>
    © 2026 Tarushi Mahesh • Frontend Developer
  </footer>

</body>
</html>
